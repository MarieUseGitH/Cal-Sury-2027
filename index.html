<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animaux de la ferme</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #f4efe5;
  color: #222;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

main {
  width: min(100%, 520px);
  padding: 38px 26px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
}

#icone {
  margin-bottom: 16px;
  font-size: 76px;
  line-height: 1;
}

h1 {
  margin: 0 0 14px;
  font-size: 30px;
}

p {
  margin: 0 0 28px;
  font-size: 17px;
  line-height: 1.5;
}

audio {
  width: 100%;
}
</style>
</head>

<body>

<main>
  <div id="icone">🐄</div>

  <h1 id="titre">Écoutez la vache</h1>

  <audio id="audio" controls preload="metadata"></audio>
</main>

<script>
const animaux = {
  vache: ["🐄", "Écoutez la vache", "Vache-CalSury27.mp3"],
  cheval: ["🐎", "Écoutez le cheval", "Cheval-CalSury27.mp3"],
  cochon: ["🐖", "Écoutez le cochon", "Cochon-CalSury27.mp3"],
  mouton: ["🐑", "Écoutez le mouton", "Mouton-CalSury27.mp3"],
  chevre: ["🐐", "Écoutez la chèvre", "Chevre-CalSury27.mp3"],
  coq: ["🐓", "Écoutez le coq", "Coq-CalSury27.mp3"],
  poussins: ["🐥", "Écoutez les poussins", "Poussins-CalSury27.mp3"],
  canard: ["🦆", "Écoutez le canard", "Canard-CalSury27.mp3"],
  ane: ["🫏", "Écoutez l’âne", "Ane-CalSury27.mp3"],
  oie: ["🪿", "Écoutez l’oie", "Oie-CalSury27.mp3"],
  dindon: ["🦃", "Écoutez le dindon", "Dindon-CalSury27.mp3"],
  chien: ["🐕", "Écoutez le chien", "Chien-CalSury27.mp3"]
};

const params = new URLSearchParams(window.location.search);
const nom = (params.get("animal") || "vache").toLowerCase();
const animal = animaux[nom] || animaux.vache;

document.getElementById("icone").textContent = animal[0];
document.getElementById("titre").textContent = animal[1];
document.getElementById("audio").src = animal[2];
</script>

</body>
</html>
