<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animaux de la ferme</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f2e9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

div{
    text-align:center;
}

#animal{
    font-size:70px;
}

h1{
    margin:10px 0;
}

audio{
    width:320px;
}
</style>
</head>

<body>

<div>
<div id="animal">🐄</div>
<h1 id="titre">La vache</h1>

<audio id="audio" controls>
</audio>

</div>

<script>

const animaux = {

vache:["🐄","La vache","Vache-CalSury27.mp3"],

cheval:["🐎","Le cheval","Cheval-CalSury27.mp3"],

cochon:["🐖","Le cochon","Cochon-CalSury27.mp3"],

mouton:["🐑","Le mouton","Mouton-CalSury27.mp3"],

chevre:["🐐","La chèvre","Chevre-CalSury27.mp3"],

coq:["🐓","Le coq","Coq-CalSury27.mp3"],

poussins:["🐥","Les poussins","Poussins-CalSury27.mp3"],

canard:["🦆","Le canard","Canard-CalSury27.mp3"],

ane:["🫏","L'âne","Ane-CalSury27.mp3"],

oie:["🪿","L'oie","Oie-CalSury27.mp3"],

dindon:["🦃","Le dindon","Dindon-CalSury27.mp3"],

chien:["🐕","Le chien","Chien-CalSury27.mp3"]

};

const url=new URL(window.location);

const nom=url.searchParams.get("animal") || "vache";

const a=animaux[nom];

document.getElementById("animal").textContent=a[0];
document.getElementById("titre").textContent=a[1];
document.getElementById("audio").src=a[2];

</script>

</body>
</html>
